#Info SpringBoot Microservices App
spring.application.name=finance-tracker
spring.info.build.encoding=UTF-8


#Spring DataSource Basic Config
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.username=postgres
# spring.jpa.open-in-view=false
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Tomcat Server Basic Config
server.port=8080
# server.tomcat.max-swallow-size=2MB

#Swagger
# springdoc.api-docs.enabled=true
# springdoc.swagger-ui.enabled=true

#Logs
logging.file.name=logs/financetracker.log
logging.level.org.springframework=INFO

# deployment.url.frontend=http://localhost:4200/